# DECARGO · nginx de la interfaz web. Sirve la SPA y reenvía /api al backend por la red interna (mismo origen: sin CORS).
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  types { application/javascript mjs; application/vnd.android.package-archive apk; }          # el trabajador de pdf.js se publica como .mjs
  server_tokens off;
  sendfile on;
  client_max_body_size 64k;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # Registro sin cadena de consulta y sin cabeceras: nunca contiene tokens ni códigos.
  log_format seguro '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';
  access_log /dev/stdout seguro;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;     # las redirecciones son relativas: nunca llevan el puerto interno (8080) ni una IP de contenedor
    # IP real del cliente tras NPM. NPM corre en este mismo equipo, así que sus conexiones llegan desde la pasarela de la red
    # `edge` (172.16.0.0/12); los clientes de la LAN llegan con su IP real y NO son de confianza. Solo desde esa pasarela se
    # acepta X-Forwarded-For, tomando la ÚLTIMA dirección (la que añade NPM = el cliente que NPM vio). Un cliente de la LAN
    # no puede falsear su IP con esta cabecera: se ignora.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;
    resolver 127.0.0.11 valid=10s ipv6=off;       # DNS interno de Docker: sigue funcionando si el backend se recrea

    location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok"; }

    # Chrome debe comprobar siempre si hay una versión nueva de estos dos ficheros para decidir la instalabilidad.
    location = /service-worker.js {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache, no-store, must-revalidate" always;
      try_files $uri =404;
    }
    # Ruta de la aplicación, rutas antiguas y manifiesto: plantilla rellenada al arrancar con DECARGO_APP_PATH (templates/app.conf.template).
    include /tmp/nginx-conf/*.conf;

    # Web pública (presentación y demo) o, si está desactivada (lo normal en una instalación de empresa), «/» lleva a la aplicación.
    # Lo genera al arrancar entrypoint/06-decargo-site.sh según DECARGO_PUBLIC_SITE (incluido arriba, en /tmp/nginx-conf/).
    location = /index.html { return 404; }   # la aplicación solo se sirve bajo su ruta

    # App Android para conductores: siempre la última versión (sin caché) y como descarga.
    location = /app/decargo.apk {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      add_header Content-Disposition 'attachment; filename="decargo.apk"' always;
      try_files $uri =404;
    }

    # Los endpoints de PRUEBA del backend no se exponen a través de la web.
    location ^~ /api/v1/dev/ { include /etc/nginx/security-headers.conf; return 404; }

    location /api/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-store" always;
      set $backend http://api:8080;
      proxy_pass $backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;      # se SOBRESCRIBE: el cliente no puede falsear su IP
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
      proxy_hide_header X-Powered-By;
    }

    location /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      try_files $uri =404;
    }

    # Resto: ficheros estáticos (iconos, logo). Lo que no existe → página «no encontrada» de la web pública (sin pistas de la aplicación).
    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache" always;
      try_files $uri =404;
    }
    error_page 404 /web/404.html;
    location = /web/404.html { internal; include /etc/nginx/security-headers.conf; add_header Cache-Control "no-cache" always; }
  }
}
